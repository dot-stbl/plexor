<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label=".stbl">
  <title>.stbl</title>
  <style>
    .stbl-mark-fg { fill: #000; }
    .stbl-mark-bg { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .stbl-mark-fg { fill: #fff; }
      .stbl-mark-bg { fill: #000; }
    }
  </style>
  <rect class="stbl-mark-fg" width="64" height="64"/>
  <rect class="stbl-mark-bg" width="32" height="32"/>
</svg>