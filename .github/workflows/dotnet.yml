name: dotnet

# Backend CI for plexor.slnx — runs the same gate as a local build
# (TreatWarningsAsErrors + VerifyFormatOnBuild + VerifyAntiPatternsOnBuild),
# then the in-process unit tests that don't need a live Postgres.
# MapperlyApiSmokeTests is excluded: it boots PostgresFixture against
# localhost:47100, which isn't on a vanilla ubuntu runner.
# Benchmarks are also excluded belt-and-suspenders (OutputType=Exe already
# keeps `dotnet test` from picking them up).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plexor.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'global.json'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plexor.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'global.json'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

# Cancel an in-flight run for the same ref when a new push lands.
# Saves CI minutes on rapid PR churn.
concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Matches global.json (10.0.109, rollForward latestFeature).
      # `10.0.x` pins to the latest .NET 10 SDK at workflow run time.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same gate as a local build. Format-on-build and analyzer
      # severity gates stay enabled — a failure here is the same as a
      # local failure, no special escape hatches.
      - name: Build
        run: dotnet build plexor.slnx -c Debug

      # Skip MapperlyApiSmokeTests (needs live Postgres) and Bench
      # (BenchmarkDotNet exes). Everything else — validators, OpenAPI,
      # ProblemDetails, rate-limit, architecture tests — runs.
      - name: Test
        run: dotnet test plexor.slnx -c Debug --no-build --nologo --filter "FullyQualifiedName!~MapperlyApiSmokeTests&FullyQualifiedName!~Bench"
