openapi: 3.0.3
info:
  title: Plexor API
  version: 0.1.0-draft
  description: >
    Design-first contract for the Plexor console. Authored on the frontend so
    screens can be built on generated hooks + faker/MSW mocks while the backend
    (Plexor.Host) is not yet available. When the backend lands it implements
    this exact contract; flip VITE_USE_MOCKS=false — screens are untouched.
    Errors follow RFC 7807 Problem Details to match the Platyflow backend convention.

servers:
  - url: /api/v1
    description: Console API (relative — proxied by Vite in dev, real host in prod)

tags:
  - name: vms
    description: Virtual machines
  - name: nodes
    description: Compute nodes (Plexor.NodeAgent hosts)
  - name: quotas
    description: Quota definitions, assignments, usage and effective rollups
  - name: branding
    description: Operator-global + per-org branding (theme tokens, logos, brand name)
  - name: audit
    description: Tenant-scoped audit timeline (append-only, query-only)
  - name: auth-providers
    description: Per-org identity provider configuration (OIDC, LDAP, ...)
  - name: oidc
    description: OIDC sign-in flow (anonymous, browser-driven)
  - name: vsphere
    description: vSphere runtime provider — inventory read/refresh + template clone (issue #77)

paths:
  /vms:
    get:
      operationId: listVms
      tags: [vms]
      summary: List virtual machines
      parameters:
        - name: zone
          in: query
          required: false
          schema: { type: string, example: eu-central-1a }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/VmStatus' }
        - name: q
          in: query
          required: false
          description: Free-text filter over name / IP / tags.
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 20 }
      responses:
        '200':
          description: Paginated list of virtual machines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmList' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: provisionVm
      tags: [vms]
      summary: Provision a virtual machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVmRequest' }
      responses:
        '201':
          description: VM accepted for provisioning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmDetail' }
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /vms/{vmId}:
    parameters:
      - $ref: '#/components/parameters/VmId'
    get:
      operationId: getVm
      tags: [vms]
      summary: Get a virtual machine
      responses:
        '200':
          description: Virtual machine detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmDetail' }
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteVm
      tags: [vms]
      summary: Delete a virtual machine
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /vms/{vmId}/start:
    parameters:
      - $ref: '#/components/parameters/VmId'
    post:
      operationId: startVm
      tags: [vms]
      summary: Start a virtual machine
      responses:
        '200':
          description: Start requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmDetail' }
        default:
          $ref: '#/components/responses/Problem'

  /vms/{vmId}/stop:
    parameters:
      - $ref: '#/components/parameters/VmId'
    post:
      operationId: stopVm
      tags: [vms]
      summary: Stop a virtual machine
      responses:
        '200':
          description: Stop requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmDetail' }
        default:
          $ref: '#/components/responses/Problem'

  /nodes/join:
    parameters: []
    post:
      operationId: nodeJoin
      tags: [nodes]
      summary: Register a compute node with the control plane
      description: >
        First message the agent sends. Returns the canonical NodeId
        and the URL the agent should call back to. The join token
        is not verified in v0.1 (every join gets a fresh Guid);
        verification lands with the auth iteration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeJoinRequest' }
      responses:
        '201':
          description: Registered. Body carries the NodeId and URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeJoinResponse' }
        '400':
          $ref: '#/components/responses/Problem'

  /nodes/{nodeId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: nodeHeartbeat
      tags: [nodes]
      summary: Record liveness from a registered node
      description: >
        Called by the agent on a fixed interval (default 30s).
        The control plane flips the node to Offline if it doesn't
        see a heartbeat in three intervals. Idempotent and silently
        ignored for unknown NodeIds in v0.1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeHeartbeatRequest' }
      responses:
        '200':
          description: Recorded. No body.
        '400':
          $ref: '#/components/responses/Problem'

  /nodes/{nodeId}/commands/poll:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: nodeCommandPoll
      tags: [nodes]
      summary: Dequeue any commands the control plane has for this node
      description: >
        Called by the agent on a fixed interval (default 5s). Returns
        any commands newer than WaitCursor plus the new cursor.
        The agent uses the returned NextCursor on the next poll.
        v0.1 simplifies the cursor to a monotonic counter per node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCommandPollRequest' }
      responses:
        '200':
          description: Any pending commands plus the new cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeCommandPollResponse' }

  /nodes/{nodeId}/commands/{commandId}/result:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/CommandId'
    post:
      operationId: nodeCommandResult
      tags: [nodes]
      summary: Report completion status for a previously-dequeued command
      description: >
        Called by the agent after it executes a command. The
        control plane logs the result in v0.1; future iterations
        route it to the audit module for persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCommandResult' }
      responses:
        '200':
          description: Recorded. No body.
        '400':
          $ref: '#/components/responses/Problem'

  # ───────────────────────── quotas ─────────────────────────
  /quotas/definitions:
    get:
      operationId: getQuotaDefinitions
      tags: [quotas]
      summary: List all quota definitions
      description: >
        Returns every quota definition registered in the platform.
        Definitions are global (org-independent) — they describe the
        metric + ceiling; assignments are how they're scoped to orgs,
        teams, and folders. The result is read-only for callers;
        definitions are seeded by the host on boot.
      responses:
        '200':
          description: List of quota definitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuotaDefinitionSummary' }
        default:
          $ref: '#/components/responses/Problem'

  /quotas/assignments:
    parameters:
      - name: scope
        in: query
        required: false
        description: Filter to a single scope tier ('org', 'team', or 'folder').
        schema: { type: string, enum: [org, team, folder] }
      - name: id
        in: query
        required: false
        description: Filter to the resource with this id (orgId/teamId/folderId depending on scope).
        schema: { type: string, format: uuid }
    get:
      operationId: listQuotaAssignments
      tags: [quotas]
      summary: List quota assignments
      description: >
        Returns every quota assignment that targets the given scope
        (or the caller's org when no filter is supplied). An
        assignment binds one definition to one scope (org, team, or
        folder) with an explicit ceiling; the effective rollup
        (GET /quotas/effective) merges assignments with parent scopes.
      responses:
        '200':
          description: List of quota assignments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuotaAssignmentSummary' }
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: upsertQuotaAssignment
      tags: [quotas]
      summary: Upsert a quota assignment
      description: >
        Creates or updates a quota assignment. The (definitionId,
        scope, scopeId) tuple is the natural key — replays against
        the same triple overwrite the existing row's ceiling. The
        audit log records both the create and the update events.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertQuotaAssignmentRequest' }
      responses:
        '200':
          description: The upserted assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaAssignmentSummary' }
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /quotas/assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteQuotaAssignment
      tags: [quotas]
      summary: Delete a quota assignment
      description: >
        Removes the assignment row. The next read of the affected
        scope (org/team/folder) reverts to the parent scope's
        effective ceiling (or the platform default if no parent
        scope has an override). 404 when no row matches.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /quotas/usage:
    parameters:
      - name: scope
        in: query
        required: false
        schema: { type: string, enum: [org, team, folder] }
      - name: id
        in: query
        required: false
        schema: { type: string, format: uuid }
    get:
      operationId: listQuotaUsage
      tags: [quotas]
      summary: Current quota usage per definition
      description: >
        Returns the live usage for every definition the scope is
        bound to. The metric is whatever the definition measures
        (vCPUs, GB of RAM, etc.) — the row's `metric` field is the
        human-readable name (e.g. `vcpu`, `ramGb`); `used` is the
        observed value, `limit` is the effective ceiling (after
        merging parent overrides).
      responses:
        '200':
          description: Per-definition usage rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuotaUsageEntry' }
        default:
          $ref: '#/components/responses/Problem'

  /quotas/effective:
    parameters:
      - name: scope
        in: query
        required: false
        schema: { type: string, enum: [org, team, folder] }
      - name: id
        in: query
        required: false
        schema: { type: string, format: uuid }
    get:
      operationId: listEffectiveQuotas
      tags: [quotas]
      summary: Effective quotas after scope merging
      description: >
        Same shape as `usage`, but `limit` is the merged ceiling
        after walking up the scope tree (folder → team → org →
        platform default). Useful for the admin UI's "what limits
        apply to this scope?" pane.
      responses:
        '200':
          description: Effective rollup rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EffectiveQuotaEntry' }
        default:
          $ref: '#/components/responses/Problem'

  # ───────────────────────── branding ─────────────────────────
  /branding/global:
    get:
      operationId: getBrandingGlobal
      tags: [branding]
      summary: Read the operator-global branding row
      description: >
        The seeder inserts a default row on first boot; the API
        returns 200 with the defaults even before the seeder runs
        (defensive). `branding.read` permission.
      responses:
        '200':
          description: Global branding configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalThemeConfigResponse' }
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateBrandingGlobal
      tags: [branding]
      summary: Upsert the operator-global branding row
      description: >
        Replaces the global row. The boot config endpoint
        (GET /branding/boot) merges this row with the caller's
        per-org override; null fields here fall back to the preset
        defaults. `branding.update` permission (admin-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertGlobalThemeConfigRequest' }
      responses:
        '200':
          description: The upserted global row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalThemeConfigResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /branding/boot:
    get:
      operationId: getBrandingBoot
      tags: [branding]
      summary: Resolved boot config for the caller
      description: >
        Merges the operator-global row + the caller's per-org
        override into a single flat object suitable for the boot
        script (writes to `window.__PLEXOR_CONFIG__` server-side).
        Null fields in the org override fall back to the global
        value; missing fields in the global row fall back to the
        preset defaults.
      responses:
        '200':
          description: Resolved branding for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingBootConfig' }
        default:
          $ref: '#/components/responses/Problem'

  /branding/theme:
    get:
      operationId: getBrandingTheme
      tags: [branding]
      summary: Read the active marketplace theme
      description: >
        Tenant-scoped (OrgId comes from the caller's bearer token
        — path-less on purpose). 404 when no marketplace theme has
        been activated yet. `branding.read` permission.
      responses:
        '200':
          description: The active marketplace installation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeInstallationResponse' }
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateBrandingTheme
      tags: [branding]
      summary: Upsert the marketplace theme installation
      description: >
        Body is `{ themeId }` only — the host looks up the canonical
        manifest in its bundled CommunityThemeRegistry and signs
        it with the purpose-bound IThemeManifestVerifier before
        persisting. Tenant-scoped. `branding.theme.update`
        permission. A real publisher feed (Phase 5+) would extend
        the request to carry a signed manifest body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertThemeInstallationRequest' }
      responses:
        '200':
          description: The upserted installation row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeInstallationResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBrandingTheme
      tags: [branding]
      summary: Reset the marketplace theme installation
      description: >
        Idempotent — a missing row is a no-op. After the delete
        the tenant reverts to the operator defaults.
        `branding.theme.update` permission.
      responses:
        '204':
          description: Reset (or already absent).
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /branding/org/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrandingOrg
      tags: [branding]
      summary: Read the per-org branding override
      description: >
        Returns 404 when no override exists for the org (the org
        inherits the operator-global row). The override is the
        per-tenant view; null fields inherit.
      responses:
        '200':
          description: Org-specific override.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgBrandingConfigResponse' }
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateBrandingOrg
      tags: [branding]
      summary: Upsert the per-org branding override
      description: >
        Null fields mean "inherit the operator-global default". The
        first write creates the override row; subsequent writes
        update in place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertOrgBrandingRequest' }
      responses:
        '200':
          description: The upserted override row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgBrandingConfigResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBrandingOrg
      tags: [branding]
      summary: Reset the per-org override
      description: >
        Idempotent — a missing row is a no-op. After the delete
        the org reverts to the operator-global defaults; the next
        call to /branding/boot returns the global values verbatim
        for that org.
      responses:
        '204':
          description: Reset (or already absent).
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ───────────────────────── audit ─────────────────────────
  /audit:
    get:
      operationId: getAudit
      tags: [audit]
      summary: Tenant-scoped audit timeline
      description: >
        Returns rows in `occurredAt` DESC order. The host forces
        `orgId = caller.tenant_id` so a caller in Org X cannot
        enumerate Org Y's rows. Pagination is offset-based via
        the `before` cursor (pass the oldest row's `occurredAt`
        from the previous page); `limit` is clamped to [1, 500]
        by the host (default 100).
      parameters:
        - name: action
          in: query
          required: false
          description: Filter to a single action wire name.
          schema: { type: string }
        - name: orgId
          in: query
          required: false
          description: Override the caller's tenant scope. Restricted to platform admins.
          schema: { type: string, format: uuid }
        - name: actorUserId
          in: query
          required: false
          description: Filter to a single actor (user or API-key owner).
          schema: { type: string, format: uuid }
        - name: since
          in: query
          required: false
          description: ISO timestamp — only events fired at-or-after this boundary.
          schema: { type: string, format: date-time }
        - name: before
          in: query
          required: false
          description: ISO timestamp — only events fired strictly before this boundary (offset cursor).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Audit rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditQueryResponse' }
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────────── auth providers (per org) ───────────────────
  /iam/orgs/{orgId}/auth-provider:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrgAuthProvider
      tags: [auth-providers]
      summary: Read the org's identity-provider configuration
      description: >
        Returns the active provider (OIDC, LDAP, or local-only) +
        the operator-controlled knobs. 404 when the org hasn't
        picked a provider yet — the platform default (local) is
        implied until then. Sensitive fields (client secrets,
        bind passwords) are write-only; the GET response carries
        a sentinel (`"***"`) instead of the real value.
      responses:
        '200':
          description: The org's auth-provider config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgAuthProviderConfigResponse' }
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateOrgAuthProvider
      tags: [auth-providers]
      summary: Upsert the org's identity-provider configuration
      description: >
        Replaces the provider config atomically. To rotate a
        secret without changing other fields, read the existing
        row, copy the unchanged fields, and re-PUT — secrets are
        write-only and a missing secret field preserves the
        stored value. The /test endpoint exists to validate the
        new config without committing to it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertOrgAuthProviderRequest' }
      responses:
        '200':
          description: The upserted config (secrets returned as sentinels).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgAuthProviderConfigResponse' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /iam/orgs/{orgId}/auth-provider/test:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: testOrgAuthProvider
      tags: [auth-providers]
      summary: Validate the org's identity-provider configuration
      description: >
        Round-trips against the configured provider without
        touching the session. Returns the result plus a
        diagnostic message; the test never persists side effects.
        Useful for the "Test connection" button on the auth
        admin page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertOrgAuthProviderRequest' }
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgAuthProviderTestResult' }
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ───────────────────────── OIDC flow (anonymous) ─────────────────────────
  /auth/oidc/authorize:
    get:
      operationId: getOidcAuthorize
      tags: [oidc]
      summary: Begin the OIDC sign-in flow
      description: >
        Anonymous. Browser-driven — the server returns a 302 to
        the configured IdP's authorization endpoint. The
        generated hook is here for completeness; in practice the
        browser navigates directly via `<a href>` or
        `window.location.assign`.
      security: []
      parameters:
        - name: org
          in: query
          required: true
          description: Tenant scope for the resulting session.
          schema: { type: string, format: uuid }
        - name: redirect
          in: query
          required: false
          description: Post-login redirect target (path only, must be on this origin).
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the IdP's authorization endpoint.
        default:
          $ref: '#/components/responses/Problem'

  /auth/oidc/callback:
    get:
      operationId: getOidcCallback
      tags: [oidc]
      summary: Handle the OIDC callback from the IdP
      description: >
        Anonymous. Exchanges the authorization code for tokens,
        sets the session cookie, and 302s to the original `redirect`
        target (or `/` if none).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the post-login target with a session cookie set.
        default:
          $ref: '#/components/responses/Problem'

  /auth/oidc/logout:
    post:
      operationId: postOidcLogout
      tags: [oidc]
      summary: Sign out and clear the session
      description: >
        Anonymous. Clears the session cookie and 302s to the IdP's
        end-session endpoint (if configured), otherwise to `/`.
      security: []
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Problem'

  # ───────────────────────── vsphere ─────────────────────────
  /vsphere/inventory:
    get:
      operationId: getVSphereInventory
      tags: [vsphere]
      summary: Read the cached vSphere inventory
      description: >
        Returns the latest vSphere inventory snapshot — header
        metadata + per-cluster / per-host / per-VM rows. 503 when
        the vSphere provider is not configured OR no snapshot has
        ever been written (caller should POST /vsphere/inventory/refresh
        first). 502 when vCenter is unreachable.
      responses:
        '200':
          description: The latest cached inventory snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VSphereInventoryResponse' }
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /vsphere/inventory/refresh:
    post:
      operationId: refreshVSphereInventory
      tags: [vsphere]
      summary: Force a fresh vSphere inventory pull
      description: >
        Triggers a synchronous refresh — the call blocks until the
        new snapshot has been written. Returns 202 with the snapshot
        id. 503 when the provider is unconfigured, 502 when vCenter
        is unreachable.
      responses:
        '202':
          description: Refresh succeeded — the new snapshot id is in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VSphereInventoryRefreshResponse' }
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /vsphere/clone:
    post:
      operationId: cloneVSphereTemplate
      tags: [vsphere]
      summary: Clone a vSphere template into a target VM folder
      description: >
        Clones a template (resolved by display name against the
        latest inventory) into the target folder path, then powers
        the new VM on. 200 on success, 404 when the template name
        isn't in the latest snapshot, 503 when unconfigured or the
        inventory is empty, 502 when vCenter rejects the clone,
        504 when vCenter times out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VSphereCloneRequestBody' }
      responses:
        '200':
          description: Clone succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VSphereCloneResponse' }
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  parameters:
    VmId:
      name: vmId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: RFC 7807 error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    VmStatus:
      type: string
      description: Lifecycle state of a VM.
      enum: [provisioning, running, stopped, error, idle]
      example: running

    Vm:
      type: object
      description: A virtual machine as shown in the list.
      required: [id, name, status, internalIp, zone, machineType, vcpu, ramGb, diskGb, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: web-prod-01 }
        status: { $ref: '#/components/schemas/VmStatus' }
        internalIp: { type: string, example: 10.128.4.21 }
        zone: { type: string, example: eu-central-1a }
        machineType: { type: string, example: standard-4 }
        vcpu: { type: integer, example: 4 }
        ramGb: { type: integer, example: 16 }
        diskGb: { type: integer, example: 120 }
        tags:
          type: array
          items: { type: string }
          example: [prod, web]
        createdAt: { type: string, format: date-time }

    VmDetail:
      allOf:
        - $ref: '#/components/schemas/Vm'
        - type: object
          description: Extra fields shown on the detail screen.
          required: [project, vpcId, subnetId, image, diskEncrypted]
          properties:
            description: { type: string, nullable: true, example: Front-end nodes }
            label: { type: string, nullable: true, example: web }
            project: { type: string, example: plexor-core }
            vpcId: { type: string, format: uuid }
            subnetId: { type: string, format: uuid }
            securityGroups:
              type: array
              items: { type: string }
              example: [default, web-ingress]
            image: { type: string, example: Ubuntu 24.04 LTS }
            diskEncrypted: { type: boolean, example: true }
            publicIp: { type: string, nullable: true, example: null }
            updatedAt: { type: string, format: date-time }

    CreateVmRequest:
      type: object
      description: Payload from the create-VM wizard.
      required: [name, project, subnetId, machineType, diskGb, image]
      properties:
        name: { type: string, minLength: 1, example: api-prod-02 }
        project: { type: string, example: plexor-core }
        vpcId: { type: string, format: uuid, nullable: true }
        subnetId: { type: string, format: uuid }
        machineType: { type: string, example: standard-4 }
        vcpu: { type: integer, minimum: 1, example: 4 }
        ramGb: { type: integer, minimum: 1, example: 16 }
        diskGb: { type: integer, minimum: 10, example: 120 }
        image: { type: string, example: Ubuntu 24.04 LTS }
        diskEncrypted: { type: boolean, default: true }
        securityGroups:
          type: array
          items: { type: string }
        label: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }

    VmList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vm' }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string, example: 'https://plexor.dev/problems/not-found' }
        title: { type: string, example: Not Found }
        status: { type: integer, example: 404 }
        detail: { type: string, example: VM not found. }
        instance: { type: string, nullable: true }

    NodeHardware:
      type: object
      description: Hardware snapshot reported by the agent on join and on every heartbeat.
      required: [cpuCores, ramBytes, diskBytes, hostname, kernelVersion]
      properties:
        cpuCores: { type: integer, minimum: 1, example: 4 }
        ramBytes: { type: integer, format: int64, minimum: 1, example: 17179869184 }
        diskBytes: { type: integer, format: int64, minimum: 1, example: 536870912000 }
        hostname: { type: string, minLength: 1, example: node-prod-1 }
        kernelVersion: { type: string, example: 6.5.0-plx }

    NodeJoinRequest:
      type: object
      description: First message the agent sends. The join token is not yet verified.
      required: [joinToken, hardware]
      properties:
        joinToken: { type: string, minLength: 1, example: pt_abc123 }
        hardware: { $ref: '#/components/schemas/NodeHardware' }

    NodeJoinResponse:
      type: object
      description: Reply to a join. The agent stores both fields and uses controlPlaneUrl for further calls.
      required: [nodeId, controlPlaneUrl]
      properties:
        nodeId: { type: string, format: uuid }
        controlPlaneUrl: { type: string, format: uri, example: 'https://cp.plexor.example/' }

    NodeHeartbeatRequest:
      type: object
      description: Periodic liveness ping from the agent.
      required: [nodeId, sentAt, hardware, runningVmCount]
      properties:
        nodeId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        hardware: { $ref: '#/components/schemas/NodeHardware' }
        runningVmCount: { type: integer, minimum: 0, example: 3 }

    NodeCommandEnvelope:
      type: object
      description: One command targeted at a node, dequeued by /commands/poll.
      required: [commandId, nodeId, type, payloadJson, issuedAt]
      properties:
        commandId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        type:
          type: string
          enum: [workload.create, workload.start, workload.stop, workload.delete]
          example: workload.start
        payloadJson: { type: string, description: Kind-specific JSON payload, opaque to the Host }
        issuedAt: { type: string, format: date-time }

    NodeCommandPollRequest:
      type: object
      description: Long-poll input. waitCursor is null on the first call.
      required: [nodeId, maxBatch]
      properties:
        nodeId: { type: string, format: uuid }
        maxBatch: { type: integer, minimum: 1, maximum: 100, example: 16 }
        waitCursor:
          type: integer
          format: int64
          nullable: true
          description: Cursor returned by the previous poll. Omit / null on the first poll.

    NodeCommandPollResponse:
      type: object
      description: Long-poll output. Empty array + current cursor means 'no new commands'.
      required: [commands, nextCursor]
      properties:
        commands:
          type: array
          items: { $ref: '#/components/schemas/NodeCommandEnvelope' }
        nextCursor: { type: integer, format: int64 }

    NodeCommandResult:
      type: object
      description: Reply to a previously-dequeued command.
      required: [commandId, nodeId, status, completedAt]
      properties:
        commandId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        status:
          type: string
          enum: [succeeded, failed]
        errorMessage:
          type: string
          nullable: true
          description: Required when status is 'failed'; null otherwise.
        completedAt: { type: string, format: date-time }

    # ───────────────────────── quotas ─────────────────────────
    QuotaDefinitionSummary:
      type: object
      description: A registered quota definition (metric + unit + platform default ceiling).
      required: [id, key, displayName, metric, unit, defaultCeiling]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Stable identifier (e.g. `compute.vcpu`, `memory.ramGb`).
          example: compute.vcpu
        displayName: { type: string, example: vCPUs per scope }
        metric:
          type: string
          description: The field on the resource this quota measures (vCPUs, GB of RAM, ...).
          example: vcpu
        unit:
          type: string
          description: Display unit (count, GB, GiB-hours, ...).
          example: count
        defaultCeiling:
          type: integer
          format: int64
          description: Platform default ceiling — applied when no assignment overrides it.
          minimum: 0
          example: 64

    QuotaAssignmentSummary:
      type: object
      description: One (definition, scope, scopeId, ceiling) tuple.
      required: [id, definitionId, scope, scopeId, ceiling, updatedAt]
      properties:
        id: { type: string, format: uuid }
        definitionId: { type: string, format: uuid }
        scope:
          type: string
          enum: [org, team, folder]
        scopeId: { type: string, format: uuid }
        ceiling:
          type: integer
          format: int64
          minimum: 0
          example: 32
        updatedAt: { type: string, format: date-time }

    QuotaUsageEntry:
      type: object
      description: Live usage for one (definition, scope) pair.
      required: [definitionId, metric, used, limit]
      properties:
        definitionId: { type: string, format: uuid }
        metric: { type: string, example: vcpu }
        used: { type: integer, format: int64, minimum: 0, example: 18 }
        limit:
          type: integer
          format: int64
          description: Effective ceiling after merging parent overrides.
          minimum: 0
          example: 32
        updatedAt: { type: string, format: date-time }

    EffectiveQuotaEntry:
      type: object
      description: Effective rollup of a definition for a scope (what ceiling applies here, after merging).
      required: [definitionId, metric, scope, scopeId, effectiveCeiling, appliedAssignmentIds]
      properties:
        definitionId: { type: string, format: uuid }
        metric: { type: string, example: vcpu }
        scope:
          type: string
          enum: [org, team, folder]
        scopeId: { type: string, format: uuid }
        effectiveCeiling:
          type: integer
          format: int64
          minimum: 0
          example: 32
        appliedAssignmentIds:
          type: array
          description: The chain of assignment ids that contributed to the effective ceiling (folder → team → org → default).
          items: { type: string, format: uuid }

    UpsertQuotaAssignmentRequest:
      type: object
      description: Wire shape for PUT /quotas/assignments. The (definitionId, scope, scopeId) tuple is the natural key.
      required: [definitionId, scope, scopeId, ceiling]
      properties:
        definitionId: { type: string, format: uuid }
        scope:
          type: string
          enum: [org, team, folder]
        scopeId: { type: string, format: uuid }
        ceiling:
          type: integer
          format: int64
          minimum: 0
          example: 32

    # ───────────────────────── branding ─────────────────────────
    GlobalThemeConfigResponse:
      type: object
      description: Operator-global branding row (Plexor.Modules.Branding).
      required: [brandName, brandLogoUrl, brandFaviconUrl, defaultPresetId, customAccent, updatedAt]
      properties:
        brandName: { type: string, example: Plexor }
        brandLogoUrl:
          type: string
          format: uri
          nullable: true
          description: URL or web-root-relative path. Null = default SVG mark.
          example: /brand.svg
        brandFaviconUrl:
          type: string
          format: uri
          nullable: true
          description: URL or web-root-relative path. Null = default favicon.
          example: /favicon.svg
        defaultPresetId: { type: string, example: plexor-default-light }
        customAccent:
          type: string
          nullable: true
          description: OKLCH color. Null = preset default.
          example: oklch(0.6 0.18 250)
        updatedAt: { type: string, format: date-time }

    UpsertGlobalThemeConfigRequest:
      type: object
      description: Wire shape for PUT /branding/global.
      required: [brandName, defaultPresetId]
      properties:
        brandName:
          type: string
          minLength: 1
          maxLength: 128
          example: Plexor
        brandLogoUrl:
          type: string
          format: uri
          nullable: true
          example: https://acme.example/logo.svg
        brandFaviconUrl:
          type: string
          format: uri
          nullable: true
          example: https://acme.example/favicon.svg
        defaultPresetId: { type: string, minLength: 1, example: plexor-default-light }
        customAccent:
          type: string
          nullable: true
          description: OKLCH color string.
          example: oklch(0.6 0.18 250)

    BrandingBootConfig:
      type: object
      description: Resolved branding for the caller — merges global row + per-org override. Written server-side into window.__PLEXOR_CONFIG__ before first paint.
      required: [brandName, brandLogoUrl, brandFaviconUrl, defaultPresetId, customAccent]
      properties:
        brandName: { type: string, example: Plexor }
        brandLogoUrl:
          type: string
          format: uri
          nullable: true
          example: /brand.svg
        brandFaviconUrl:
          type: string
          format: uri
          nullable: true
          example: /favicon.svg
        defaultPresetId: { type: string, example: plexor-default-light }
        customAccent:
          type: string
          nullable: true
          example: oklch(0.6 0.18 250)

    OrgBrandingConfigResponse:
      type: object
      description: Per-org override row. Null fields inherit the operator-global default.
      required: [orgId, presetId, customAccent, brandName, brandLogoUrl, brandFaviconUrl, updatedAt]
      properties:
        orgId: { type: string, format: uuid }
        presetId:
          type: string
          nullable: true
          description: Per-org theme preset override. Null = inherit.
          example: plexor-noir
        customAccent:
          type: string
          nullable: true
          description: OKLCH color. Null = inherit.
          example: oklch(0.6 0.18 30)
        brandName:
          type: string
          nullable: true
          description: Per-org brand name. Null = inherit.
          example: Acme Cloud
        brandLogoUrl:
          type: string
          format: uri
          nullable: true
        brandFaviconUrl:
          type: string
          format: uri
          nullable: true
        updatedAt: { type: string, format: date-time }

    UpsertOrgBrandingRequest:
      type: object
      description: Wire shape for PUT /branding/org/{orgId}. Null fields mean "inherit the operator global default".
      properties:
        presetId: { type: string, nullable: true }
        customAccent: { type: string, nullable: true }
        brandName: { type: string, nullable: true, maxLength: 128 }
        brandLogoUrl: { type: string, format: uri, nullable: true }
        brandFaviconUrl: { type: string, format: uri, nullable: true }

    UpsertThemeInstallationRequest:
      type: object
      description: >
        Wire shape for PUT /branding/theme. The host looks the
        theme up in its bundled CommunityThemeRegistry and signs
        the canonical manifest with the purpose-bound
        IThemeManifestVerifier before persisting.
      required: [themeId]
      properties:
        themeId:
          type: string
          maxLength: 64
          description: Marketplace id from the host-side CommunityThemeRegistry.
          example: synthwave-night-dark

    ThemeInstallationResponse:
      type: object
      description: Active marketplace theme + the signature the FE boot script re-verifies.
      required: [orgId, themeId, name, version, author, manifestSignature, activatedAt, activatedBy]
      properties:
        orgId: { type: string, format: uuid }
        themeId:
          type: string
          maxLength: 64
          example: synthwave-night-dark
        name:
          type: string
          maxLength: 128
          example: Synthwave Night — Dark
        version: { type: string, maxLength: 64, example: 0.1.0 }
        author: { type: string, maxLength: 128, example: plexor-themes }
        manifestSignature:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-fA-F]{64}$'
          description: Hex-encoded HMAC-SHA256 persisted on the row.
        activatedAt: { type: string, format: date-time }
        activatedBy: { type: string, format: uuid }

    # ───────────────────────── audit ─────────────────────────
    AuditQueryResponse:
      type: object
      description: One row in the audit timeline.
      required: [id, action, orgId, actorUserId, targetKind, targetId, payload, occurredAt]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: Stable dot.case wire name (e.g. `quotas.assignment.changed`).
          example: quotas.assignment.changed
        orgId: { type: string, format: uuid }
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: Id of the user (or API-key owner) that triggered the event.
        targetKind:
          type: string
          description: Short discriminator of what the event refers to.
          example: quota_assignment
        targetId:
          type: string
          format: uuid
          nullable: true
          description: Id of the affected entity. Null when the event doesn't reference a single row.
        payload:
          type: object
          description: Action-specific context keys parsed from the row's payload_json column. A malformed payload falls back to a single `_raw` key.
          additionalProperties: true
          example:
            ceiling: 32
            scope: org
        occurredAt: { type: string, format: date-time }

    # ─────────────────── auth providers (per org) ───────────────────
    OrgAuthProviderConfigResponse:
      type: object
      description: The org's identity-provider configuration. Sensitive fields (client secrets, bind passwords) are write-only; the GET response carries a sentinel (`***`) instead of the real value.
      required: [orgId, provider, updatedAt]
      properties:
        orgId: { type: string, format: uuid }
        provider:
          type: string
          enum: [local, oidc, ldap]
          description: Active provider for this org.
          example: oidc
        updatedAt: { type: string, format: date-time }
        oidc:
          type: object
          nullable: true
          description: OIDC-specific config (only set when provider = oidc).
          required: [issuer, clientId]
          properties:
            issuer:
              type: string
              format: uri
              example: 'https://kc.example.com/realms/tessera'
            clientId: { type: string, example: tessera-console }
            clientSecretSentinel:
              type: string
              nullable: true
              description: "`***` when a secret is stored; null when none configured."
              example: '***'
            scopes:
              type: array
              items: { type: string }
              example: [openid, profile, email]
            redirectUri:
              type: string
              format: uri
              example: 'https://console.example.com/auth/oidc/callback'
            claimMappings:
              type: object
              description: Maps OIDC claims onto Plexor user fields.
              additionalProperties: { type: string }
              example:
                org: 'https://plexor.example.com/claims/org'
                team: 'https://plexor.example.com/claims/team'
        ldap:
          type: object
          nullable: true
          description: LDAP-specific config (only set when provider = ldap).
          required: [server, baseDn, bindDn, userFilter]
          properties:
            server: { type: string, example: 'ldap://ldap.example.com' }
            baseDn: { type: string, example: 'dc=example,dc=com' }
            bindDn: { type: string, example: 'cn=plexor,ou=services,dc=example,dc=com' }
            bindPasswordSentinel:
              type: string
              nullable: true
              description: "`***` when a password is stored; null when none configured."
              example: '***'
            userFilter: { type: string, example: '(uid={0})' }
            roleAttribute: { type: string, nullable: true, example: memberOf }

    UpsertOrgAuthProviderRequest:
      type: object
      description: Wire shape for PUT /iam/orgs/{orgId}/auth-provider. Omit a sensitive field to keep the stored value unchanged (write-only secrets).
      required: [provider]
      properties:
        provider:
          type: string
          enum: [local, oidc, ldap]
        oidc:
          type: object
          nullable: true
          properties:
            issuer: { type: string, format: uri }
            clientId: { type: string, minLength: 1 }
            clientSecret:
              type: string
              nullable: true
              description: Write-only. Omit (or send the sentinel `***`) to keep the existing value.
            scopes:
              type: array
              items: { type: string }
            redirectUri: { type: string, format: uri }
            claimMappings:
              type: object
              additionalProperties: { type: string }
        ldap:
          type: object
          nullable: true
          properties:
            server: { type: string }
            baseDn: { type: string }
            bindDn: { type: string }
            bindPassword:
              type: string
              nullable: true
              description: Write-only. Omit (or send the sentinel `***`) to keep the existing value.
            userFilter: { type: string }
            roleAttribute: { type: string, nullable: true }

    OrgAuthProviderTestResult:
      type: object
      description: Result of POST /iam/orgs/{orgId}/auth-provider/test. The test never persists side effects.
      required: [ok, message]
      properties:
        ok: { type: boolean, example: true }
        message:
          type: string
          description: "Human-readable diagnostic. For OIDC: the discovery + token-exchange result. For LDAP: the bind result."
          example: 'OIDC discovery succeeded; JWKS published at /jwks; token exchange simulated.'
        latencyMs:
          type: integer
          minimum: 0
          nullable: true
          description: Round-trip latency in milliseconds. Null when the test failed before a request was issued.
          example: 87
        details:
          type: object
          nullable: true
          description: Provider-specific diagnostics (discovery URL, JWKS URL, bind subject, ...). Free-form.
          additionalProperties: true

    VSphereInventorySnapshotHeader:
      type: object
      description: Snapshot header for GET /api/v1/vsphere/inventory. Carries the snapshot id + per-resource row counts + the refresh timestamp.
      required: [id, vcenterMoref, datacenterCount, clusterCount, hostCount, virtualMachineCount, refreshedAt]
      properties:
        id: { type: string, format: uuid, description: "Snapshot id (UUID v7)." }
        vcenterMoref:
          type: string
          description: "vCenter identifier the snapshot was pulled from."
          example: primary
        datacenterCount: { type: integer, minimum: 0, example: 1 }
        clusterCount: { type: integer, minimum: 0, example: 2 }
        hostCount: { type: integer, minimum: 0, example: 6 }
        virtualMachineCount: { type: integer, minimum: 0, example: 42 }
        refreshedAt: { type: string, format: date-time, description: "UTC timestamp the snapshot was written." }

    VSphereInventoryClusterRow:
      type: object
      description: Cluster row in the vSphere inventory snapshot.
      required: [moref, name, datacenterMoref, drsEnabled]
      properties:
        moref: { type: string, example: domain-c7, description: "Cluster mo-ref." }
        name: { type: string, example: cluster-prod-01 }
        datacenterMoref: { type: string, example: datacenter-2, description: "Parent datacenter mo-ref." }
        drsEnabled:
          type: boolean
          description: "When true, vSphere DRS handles initial placement + load balancing."
          example: true

    VSphereInventoryHostRow:
      type: object
      description: ESXi host row in the vSphere inventory snapshot.
      required: [moref, name, clusterMoref, connectionState, cpuCores, memoryMib]
      properties:
        moref: { type: string, example: host-21, description: "Host mo-ref." }
        name: { type: string, example: esxi-01.corp.example.com }
        clusterMoref: { type: string, example: domain-c7, description: "Parent cluster mo-ref." }
        connectionState:
          type: string
          enum: [CONNECTED, DISCONNECTED, NOT_RESPONDING]
          example: CONNECTED
        cpuCores: { type: integer, minimum: 0, example: 32, description: "Total logical CPU cores (sockets × cores)." }
        memoryMib:
          type: integer
          format: int64
          minimum: 0
          example: 262144
          description: "Total physical memory in MiB."

    VSphereInventoryVirtualMachineRow:
      type: object
      description: Virtual machine row in the vSphere inventory snapshot (non-template only).
      required: [moref, name, powerState, cpuCount, memoryMib]
      properties:
        moref: { type: string, example: vm-1234, description: "VM mo-ref." }
        name: { type: string, example: web-prod-01 }
        folderPath:
          type: string
          nullable: true
          example: /Datacenter/vm/Tenants/Acme
          description: "Inventory folder path; null when at root."
        powerState:
          type: string
          enum: [POWERED_ON, POWERED_OFF, SUSPENDED]
          example: POWERED_ON
        cpuCount: { type: integer, minimum: 0, example: 4, description: "CPU count allocated to the VM." }
        memoryMib:
          type: integer
          format: int64
          minimum: 0
          example: 16384
          description: "Memory in MiB allocated to the VM."
        hostMoref:
          type: string
          nullable: true
          example: host-21
          description: "Parent host mo-ref; null for templates (currently never returned — templates are out of scope for v1)."

    VSphereInventoryResponse:
      type: object
      description: Top-level response for GET /api/v1/vsphere/inventory. Bundles the snapshot header + the per-resource row lists so the caller can render the inventory in a single round trip.
      required: [snapshot, clusters, hosts, virtualMachines]
      properties:
        snapshot: { $ref: '#/components/schemas/VSphereInventorySnapshotHeader' }
        clusters:
          type: array
          items: { $ref: '#/components/schemas/VSphereInventoryClusterRow' }
        hosts:
          type: array
          items: { $ref: '#/components/schemas/VSphereInventoryHostRow' }
        virtualMachines:
          type: array
          items: { $ref: '#/components/schemas/VSphereInventoryVirtualMachineRow' }

    VSphereInventoryRefreshResponse:
      type: object
      description: Body for the 202 response on POST /api/v1/vsphere/inventory/refresh.
      required: [snapshotId, status]
      properties:
        snapshotId: { type: string, format: uuid, description: "The newly written snapshot id." }
        status:
          type: string
          enum: [SUCCESS]
          example: SUCCESS

    VSphereCloneRequestBody:
      type: object
      description: Body for POST /api/v1/vsphere/clone.
      required: [templateName, name]
      properties:
        templateName:
          type: string
          minLength: 1
          example: ubuntu-22.04-base
          description: "Display name of the source template. Resolved against the latest cached inventory; a missing template surfaces as 404."
        name:
          type: string
          minLength: 1
          example: web-prod-01
          description: "Display name for the new VM."
        folderPath:
          type: string
          nullable: true
          example: /Datacenter/vm/Tenants/Acme
          description: "Inventory folder path for the new VM; null when the caller does not care (vCenter default folder)."

    VSphereCloneResponse:
      type: object
      description: Body for the 200 response on POST /api/v1/vsphere/clone.
      required: [vmMoref, status]
      properties:
        runId:
          type: string
          format: uuid
          nullable: true
          description: "Audit-trail row id (UUID v7). Null when the service omits it."
        vmMoref:
          type: string
          description: "vCenter mo-ref for the new VM."
          example: vm-5678
        status:
          type: string
          enum: [SUCCESS]
          example: SUCCESS
